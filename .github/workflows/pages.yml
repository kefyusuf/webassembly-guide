name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-demo:
    name: Build & deploy the browser demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.21"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Build Rust module (02)
        working-directory: examples/02-rust-web
        run: bash build.sh

      - name: Build Go module (04)
        working-directory: examples/04-go-wasm
        run: bash build.sh

      - name: Build AssemblyScript module (05)
        working-directory: examples/05-assemblyscript
        run: |
          npm install --no-fund --no-audit
          npm run asbuild

      - name: Build WasmGC module (11)
        working-directory: examples/11-wasmgc
        run: bash build.sh

      - name: Build SIMD module (13)
        working-directory: examples/13-simd
        run: bash build.sh

      - name: Build JSPI module (18)
        working-directory: examples/18-jspi
        run: bash build.sh

      - name: Render docs to HTML
        run: node scripts/render-docs.mjs _pages/docs

      # Assemble the site preserving the demo's relative fetch paths
      # (07-web-demo/index.html fetches ../02-rust-web/dist/… etc.)
      - name: Assemble site
        run: |
          mkdir -p _pages/07-web-demo
          cp examples/07-web-demo/index.html _pages/07-web-demo/
          mkdir -p _pages/02-rust-web _pages/04-go-wasm _pages/05-assemblyscript _pages/11-wasmgc _pages/13-simd _pages/18-jspi
          cp -r examples/02-rust-web/dist _pages/02-rust-web/
          cp -r examples/04-go-wasm/dist _pages/04-go-wasm/
          cp -r examples/05-assemblyscript/dist _pages/05-assemblyscript/
          cp -r examples/11-wasmgc/dist _pages/11-wasmgc/
          cp -r examples/13-simd/dist _pages/13-simd/
          mkdir -p _pages/18-jspi
          cp examples/18-jspi/jspi.html _pages/18-jspi/index.html
          cp examples/18-jspi/dist/jspi.wasm _pages/18-jspi/
          cp scripts/templates/pages-index.html _pages/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
