name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.21"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1,wasm32-wasip1-threads,wasm32-wasip2,wasm32-wasip3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            examples/02-rust-web
            examples/03-rust-wasi
            examples/12-component-model
            examples/14-wasm-bindgen

      - name: Install Python wasmtime
        run: pip install wasmtime

      # 01 — WAT basics (compiles via the wabt npm package)
      - name: Example 01 — WAT basics
        working-directory: examples/01-wat-basics
        run: |
          npm install --no-fund --no-audit
          node run.mjs

      # 02 — Rust → wasm32-unknown-unknown
      - name: Example 02 — Rust web
        working-directory: examples/02-rust-web
        run: |
          bash build.sh
          node test.mjs

      # 03 — Rust → wasm32-wasip1 (WASI)
      - name: Example 03 — Rust WASI
        working-directory: examples/03-rust-wasi
        run: |
          bash build.sh
          node test.mjs

      # 04 — Go → wasm
      - name: Example 04 — Go
        working-directory: examples/04-go-wasm
        run: |
          bash build.sh
          node test.mjs

      # 05 — AssemblyScript
      - name: Example 05 — AssemblyScript
        working-directory: examples/05-assemblyscript
        run: |
          npm install --no-fund --no-audit
          npm run asbuild
          node test.mjs

      # 06 — C → Emscripten (Linux only: emsdk setup is slow on Windows)
      - name: Example 06 — C / Emscripten
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install latest
          /tmp/emsdk/emsdk activate latest
          source /tmp/emsdk/emsdk_env.sh
          cd examples/06-c-emscripten
          bash build.sh
          node test.mjs

      # 08 — raw WebAssembly API in Node (also cross-checks 01/02/05 artifacts)
      - name: Example 08 — Node WebAssembly API
        working-directory: examples/08-node-demo
        run: node run.mjs

      # 11 — WasmGC structs/arrays in raw WAT (via wasm-tools)
      - name: Example 11 — WasmGC
        working-directory: examples/11-wasmgc
        run: |
          bash build.sh
          node test.mjs

      # 12 — Component Model (WIT → wasm32-wasip2 component)
      - name: Example 12 — Component Model
        working-directory: examples/12-component-model
        run: |
          bash build.sh
          node test.mjs
          python test_component.py

      # 13 — SIMD: scalar vs v128 sum (via wasm-tools)
      - name: Example 13 — SIMD
        working-directory: examples/13-simd
        run: |
          bash build.sh
          node test.mjs

      # 14 — wasm-bindgen ("production Rust")
      - name: Example 14 — wasm-bindgen
        working-directory: examples/14-wasm-bindgen
        run: |
          bash build.sh
          node test.mjs

      # 15 — threads via wasi-threads (pinned wasmtime v25; legacy proposal)
      - name: Example 15 — Threads
        working-directory: examples/15-threads
        run: |
          bash build.sh
          node test.mjs

      # 16 — async around a synchronous core (worker_threads)
      - name: Example 16 — Async
        working-directory: examples/16-async
        run: node test.mjs

      # 17 — wasm-pack: full npm package lifecycle (pack → install → consume)
      - name: Example 17 — wasm-pack
        working-directory: examples/17-wasm-pack
        run: |
          bash build.sh
          node test.mjs

      # 18 — JSPI (requires Node 26+: JSPI on by default)
      - name: Example 18 — JSPI
        working-directory: examples/18-jspi
        run: |
          bash build.sh
          node test.mjs

      # 19 — WASI 0.3 native async (wasm32-wasip3, Tier 2; needs Rust 1.100+,
      #      wkg for WIT deps, pinned wasmtime 49 — installed by build.sh)
      - name: Example 19 — WASI 0.3 async
        working-directory: examples/19-wasi03-async
        run: |
          bash build.sh
          node test.mjs

      # 20 — wasm-bindgen-futures over WebSocket (Node 26 native WebSocket
      #      client against a real `ws` echo server)
      - name: Example 20 — futures + WebSocket
        working-directory: examples/20-wasm-futures-websocket
        run: |
          npm install --no-fund --no-audit
          bash build.sh
          node test.mjs

      # Cross-language benchmark (uses artifacts of 01/02/04/05 built above)
      - name: Benchmark — cross-language fib
        run: |
          node bench/compare.mjs
          node bench/test.mjs

      # Documentation hygiene: every relative markdown link must resolve
      - name: Check markdown links
        run: node scripts/check-links.mjs

      # 09 — Python as a Wasm host (wasmtime-py, reuses example 03's module)
      - name: Example 09 — Python wasmtime host
        run: python examples/09-python-wasm/run_wasmtime.py

      # 10 — C# / Blazor WebAssembly (minimal SPA → static publish bundle;
      #      test.mjs checks the runtime and the app assembly as real .wasm)
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Example 10 — Blazor WebAssembly
        working-directory: examples/10-csharp-blazor
        run: |
          bash build.sh
          node test.mjs
